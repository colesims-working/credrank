<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>CredRank</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: #0f1117;
            color: #e4e4e7;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 16px 24px;
            background: #161822;
            border-bottom: 1px solid #2a2d3a;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        header h1 {
            font-size: 20px;
            font-weight: 700;
            color: #818cf8;
            margin-right: 8px;
        }

        .search-bar {
            display: flex;
            gap: 8px;
            flex: 1;
            min-width: 300px;
        }

        input, select {
            background: #1e2030;
            border: 1px solid #2a2d3a;
            color: #e4e4e7;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
        }

        input:focus { outline: none; border-color: #818cf8; }
        input::placeholder { color: #6b7280; }

        .search-bar input[type="text"] { flex: 1; }

        button {
            background: #818cf8;
            color: #0f1117;
            border: none;
            padding: 8px 20px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #6366f1; }
        button:disabled { background: #3f3f46; cursor: not-allowed; color: #71717a; }

        .location-bar {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .location-bar input[type="text"] {
            flex: 1;
            min-width: 180px;
        }

        .locate-btn {
            background: none;
            border: 1px solid #2a2d3a;
            color: #818cf8;
            padding: 8px 12px;
            font-size: 14px;
            border-radius: 6px;
            cursor: pointer;
            white-space: nowrap;
        }
        .locate-btn:hover { background: #1e2040; }

        .radius-select {
            background: #1e2030;
            border: 1px solid #2a2d3a;
            color: #e4e4e7;
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 14px;
        }

        .advanced-toggle {
            font-size: 11px;
            color: #6b7280;
            cursor: pointer;
            user-select: none;
        }
        .advanced-toggle:hover { color: #818cf8; }
        .advanced-fields {
            display: none;
            gap: 8px;
            align-items: center;
        }
        .advanced-fields.visible { display: flex; }
        .advanced-fields input { width: 90px; }

        .content {
            display: flex;
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        .results-panel {
            width: 440px;
            overflow-y: auto;
            border-right: 1px solid #2a2d3a;
            padding: 0;
        }

        .result-card {
            padding: 14px 18px;
            border-bottom: 1px solid #1e2030;
            cursor: pointer;
            transition: background 0.15s;
            display: flex;
            gap: 14px;
            align-items: flex-start;
        }
        .result-card:hover { background: #1a1c2e; }
        .result-card.active { background: #1e2040; border-left: 3px solid #818cf8; }

        .rank-badge {
            background: #818cf8;
            color: #0f1117;
            font-weight: 700;
            font-size: 13px;
            min-width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .place-info { flex: 1; min-width: 0; }
        .place-name {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .place-meta {
            font-size: 12px;
            color: #a1a1aa;
            display: flex;
            gap: 10px;
            margin-bottom: 4px;
        }
        .place-meta .score { color: #818cf8; font-weight: 600; }
        .place-meta .rating { color: #facc15; }
        .place-address {
            font-size: 11px;
            color: #71717a;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .place-summary {
            font-size: 12px;
            color: #a1a1aa;
            margin-top: 6px;
            font-style: italic;
            line-height: 1.4;
        }

        .summary-btn {
            background: none;
            border: 1px solid #2a2d3a;
            color: #818cf8;
            padding: 3px 8px;
            font-size: 11px;
            border-radius: 4px;
            margin-top: 6px;
            cursor: pointer;
            font-weight: 500;
        }
        .summary-btn:hover { background: #1e2040; }
        .summary-btn:disabled { color: #3f3f46; border-color: #1e2030; }

        #map { flex: 1; }

        .status-bar {
            padding: 8px 18px;
            background: #161822;
            border-top: 1px solid #2a2d3a;
            font-size: 12px;
            color: #71717a;
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #71717a;
            font-size: 14px;
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.visible { display: flex; }

        .modal {
            background: #161822;
            border: 1px solid #2a2d3a;
            border-radius: 12px;
            padding: 24px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }
        .modal h2 { font-size: 18px; color: #818cf8; margin-bottom: 4px; }
        .modal .subtitle { font-size: 13px; color: #71717a; margin-bottom: 16px; }
        .modal p { font-size: 14px; line-height: 1.6; margin-bottom: 12px; }
        .modal .rec-item {
            padding: 8px 0;
            border-bottom: 1px solid #1e2030;
        }
        .modal .rec-item:last-child { border: none; }
        .modal .rec-name { font-weight: 600; color: #e4e4e7; }
        .modal .rec-why { font-size: 13px; color: #a1a1aa; }
        .modal .rec-mentions { font-size: 11px; color: #818cf8; }
        .modal .avoid-section { margin-top: 16px; }
        .modal .avoid-label { color: #f87171; font-weight: 600; font-size: 13px; margin-bottom: 6px; }
        .modal .avoid-item { font-size: 13px; color: #a1a1aa; padding: 4px 0; }
        .modal .close-btn {
            margin-top: 16px;
            width: 100%;
            background: #2a2d3a;
            color: #e4e4e7;
        }

        /* Mobile toggle bar */
        .mobile-tabs {
            display: none;
            background: #161822;
            border-top: 1px solid #2a2d3a;
        }

        .mobile-tabs button {
            flex: 1;
            background: none;
            color: #71717a;
            border: none;
            padding: 12px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 0;
        }
        .mobile-tabs button.active {
            color: #818cf8;
            border-top: 2px solid #818cf8;
        }

        /* --- Mobile Responsive --- */
        @media (max-width: 768px) {
            body {
                padding-bottom: env(safe-area-inset-bottom, 0);
            }

            header {
                padding: 10px 14px;
                padding-top: max(10px, env(safe-area-inset-top, 0));
                gap: 8px;
            }

            header h1 {
                font-size: 18px;
            }

            .search-bar {
                min-width: unset;
                width: 100%;
                flex-wrap: wrap;
                gap: 6px;
            }

            .search-bar input[type="text"] {
                width: 100%;
                flex: unset;
                font-size: 16px;
                padding: 10px 12px;
            }

            .location-bar {
                width: 100%;
            }

            .location-bar input[type="text"] {
                font-size: 16px;
                padding: 10px 12px;
            }

            .locate-btn {
                padding: 10px 12px;
            }

            .search-bar button {
                width: 100%;
                padding: 12px;
                font-size: 16px;
            }

            .advanced-toggle { display: none; }
            .advanced-fields { display: none !important; }

            .content {
                flex-direction: column;
            }

            .results-panel {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid #2a2d3a;
            }

            .content.show-list .results-panel {
                flex: 1;
                max-height: unset;
                overflow-y: auto;
            }
            .content.show-list #map { display: none; }

            .content.show-map .results-panel { display: none; }
            .content.show-map #map {
                flex: 1;
                min-height: unset;
            }

            .mobile-tabs {
                display: flex;
                position: sticky;
                bottom: 0;
                z-index: 500;
                padding-bottom: env(safe-area-inset-bottom, 0);
            }

            .status-bar { display: none; }

            .result-card {
                padding: 12px 14px;
            }

            .rank-badge {
                min-width: 28px;
                height: 28px;
                font-size: 12px;
            }

            .place-name { font-size: 13px; }
            .place-meta { font-size: 11px; gap: 6px; }

            .summary-btn {
                padding: 8px 14px;
                font-size: 12px;
            }

            .modal {
                max-width: 100%;
                width: 100%;
                height: 100%;
                max-height: 100dvh;
                border-radius: 0;
                padding-bottom: calc(24px + env(safe-area-inset-bottom, 0));
            }

            .modal h2 { font-size: 16px; }

            .modal .close-btn {
                padding: 14px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>CredRank</h1>
        <div class="search-bar">
            <input type="text" id="query" placeholder="What are you looking for?" value="best pizza">
            <div class="location-bar">
                <input type="text" id="locationInput" placeholder="City, address, or neighborhood">
                <button class="locate-btn" onclick="useMyLocation()">📍 Near me</button>
                <select class="radius-select" id="radiusSelect">
                    <option value="1609">1 mi</option>
                    <option value="4828">3 mi</option>
                    <option value="8047" selected>5 mi</option>
                    <option value="16093">10 mi</option>
                    <option value="32187">20 mi</option>
                </select>
            </div>
            <span class="advanced-toggle" onclick="toggleAdvanced()">▸ Coordinates</span>
            <div class="advanced-fields" id="advancedFields">
                <input type="number" id="lat" placeholder="Lat" step="0.001" style="width:90px">
                <input type="number" id="lng" placeholder="Lng" step="0.001" style="width:90px">
            </div>
            <button id="searchBtn" onclick="doSearch()">Search</button>
        </div>
    </header>

    <div class="content show-list" id="contentArea">
        <div class="results-panel" id="resultsPanel">
            <div class="loading">Search for something to get started</div>
        </div>
        <div id="map"></div>
    </div>

    <div class="mobile-tabs" id="mobileTabs">
        <button class="active" onclick="showView('list')">List</button>
        <button onclick="showView('map')">Map</button>
    </div>

    <div class="status-bar" id="statusBar">Ready</div>

    <!-- Recommend modal -->
    <div class="modal-overlay" id="recommendModal">
        <div class="modal">
            <h2 id="modalTitle"></h2>
            <p class="subtitle" id="modalSubtitle"></p>
            <p id="modalSummary"></p>
            <div id="modalRecs"></div>
            <div id="modalAvoid"></div>
            <button class="close-btn" onclick="closeModal()">Close</button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // --- State ---
        let currentLat = null;
        let currentLng = null;
        let placeMarkers = [];
        let searchCircle = null;
        let centerMarker = null;
        let radiusHandle = null;
        let currentResults = [];

        // --- Map Setup ---
        const map = L.map('map').setView([37.54, -77.43], 12);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OSM &amp; CARTO',
            maxZoom: 19
        }).addTo(map);

        // --- Geocoding ---
        async function geocodeLocation(text) {
            const key = await fetch('/api/config/maps-key').then(r => r.json()).then(d => d.key).catch(() => null);
            if (!key) {
                setStatus('Geocoding unavailable');
                return null;
            }

            const url = `https://maps.googleapis.com/maps/api/geocode/json?address=${encodeURIComponent(text)}&key=${key}`;
            const resp = await fetch(url);
            const data = await resp.json();

            if (data.results && data.results.length > 0) {
                const loc = data.results[0].geometry.location;
                return { lat: loc.lat, lng: loc.lng, name: data.results[0].formatted_address };
            }
            return null;
        }

        // --- Use My Location ---
        function useMyLocation() {
            if (!navigator.geolocation) {
                setStatus('Geolocation not supported by this browser');
                return;
            }

            const btn = document.querySelector('.locate-btn');
            btn.textContent = '⏳ Locating...';

            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    currentLat = pos.coords.latitude;
                    currentLng = pos.coords.longitude;
                    document.getElementById('lat').value = currentLat.toFixed(4);
                    document.getElementById('lng').value = currentLng.toFixed(4);
                    document.getElementById('locationInput').value = `${currentLat.toFixed(3)}, ${currentLng.toFixed(3)}`;
                    map.setView([currentLat, currentLng], 13);
                    drawSearchBoundary();
                    btn.textContent = '📍 Near me';
                    setStatus('Using your location');
                },
                (err) => {
                    btn.textContent = '📍 Near me';
                    if (err.code === 1) {
                        setStatus('Location access denied — try entering a city name instead');
                    } else if (err.code === 3) {
                        setStatus('Location timed out — try entering a city name instead');
                    } else {
                        setStatus('Location requires HTTPS — enter a city name or use desktop');
                    }
                },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        }

        // --- Resolve location before search ---
        async function resolveLocation() {
            const locInput = document.getElementById('locationInput').value.trim();
            const latInput = document.getElementById('lat').value;
            const lngInput = document.getElementById('lng').value;

            if (latInput && lngInput) {
                currentLat = parseFloat(latInput);
                currentLng = parseFloat(lngInput);
                return true;
            }

            if (locInput) {
                setStatus('Finding location...');
                const result = await geocodeLocation(locInput);
                if (result) {
                    currentLat = result.lat;
                    currentLng = result.lng;
                    document.getElementById('lat').value = result.lat.toFixed(4);
                    document.getElementById('lng').value = result.lng.toFixed(4);
                    document.getElementById('locationInput').value = result.name;
                    return true;
                } else {
                    setStatus('Location not found — try a different search');
                    return false;
                }
            }

            setStatus('Enter a location or tap 📍 Near me');
            return false;
        }

        // --- Boundary drawing (circle only — rectangle is hidden backend detail) ---
        function getRadius() {
            return parseInt(document.getElementById('radiusSelect').value);
        }

        function drawSearchBoundary() {
            if (!currentLat || !currentLng) return;
            const radius = getRadius();

            if (searchCircle) map.removeLayer(searchCircle);
            if (centerMarker) map.removeLayer(centerMarker);
            if (radiusHandle) map.removeLayer(radiusHandle);

            // Clean circle boundary
            searchCircle = L.circle([currentLat, currentLng], {
                radius: radius,
                color: '#818cf8',
                fillColor: '#818cf8',
                fillOpacity: 0.04,
                weight: 2,
                dashArray: '8 4',
            }).addTo(map);

            // Draggable center
            centerMarker = L.marker([currentLat, currentLng], {
                draggable: true,
                icon: L.divIcon({
                    className: '',
                    html: '<div style="width:14px;height:14px;background:#818cf8;border:2px solid #0f1117;border-radius:50%;"></div>',
                    iconSize: [14, 14],
                    iconAnchor: [7, 7],
                }),
            }).addTo(map);

            centerMarker.bindTooltip('Drag to move center', { direction: 'top', offset: [0, -10] });

            centerMarker.on('dragend', function(e) {
                const pos = e.target.getLatLng();
                currentLat = pos.lat;
                currentLng = pos.lng;
                document.getElementById('lat').value = pos.lat.toFixed(4);
                document.getElementById('lng').value = pos.lng.toFixed(4);
                document.getElementById('locationInput').value = `${pos.lat.toFixed(3)}, ${pos.lng.toFixed(3)}`;
                drawSearchBoundary();
            });

            // Draggable radius handle
            const handleLng = currentLng + radius / (111320 * Math.cos(currentLat * Math.PI / 180));
            radiusHandle = L.marker([currentLat, handleLng], {
                draggable: true,
                icon: L.divIcon({
                    className: '',
                    html: '<div style="width:10px;height:10px;background:#facc15;border:2px solid #0f1117;border-radius:50%;"></div>',
                    iconSize: [10, 10],
                    iconAnchor: [5, 5],
                }),
            }).addTo(map);

            radiusHandle.bindTooltip('Drag to resize', { direction: 'top', offset: [0, -10] });

            radiusHandle.on('drag', function(e) {
                const center = centerMarker.getLatLng();
                const handle = e.target.getLatLng();
                const newRadius = Math.round(center.distanceTo(handle));

                // Snap to nearest option
                const options = [1609, 4828, 8047, 16093, 32187];
                const closest = options.reduce((a, b) => Math.abs(b - newRadius) < Math.abs(a - newRadius) ? b : a);
                document.getElementById('radiusSelect').value = closest;

                if (searchCircle) map.removeLayer(searchCircle);
                searchCircle = L.circle([center.lat, center.lng], {
                    radius: newRadius,
                    color: '#818cf8',
                    fillColor: '#818cf8',
                    fillOpacity: 0.04,
                    weight: 2,
                    dashArray: '8 4',
                }).addTo(map);
            });
        }

        document.getElementById('radiusSelect').addEventListener('change', drawSearchBoundary);

        // --- Mobile view toggle ---
        function showView(view) {
            const content = document.getElementById('contentArea');
            const tabs = document.getElementById('mobileTabs').querySelectorAll('button');

            content.classList.remove('show-list', 'show-map');
            content.classList.add('show-' + view);

            tabs.forEach(t => t.classList.remove('active'));
            tabs[view === 'list' ? 0 : 1].classList.add('active');

            if (view === 'map') {
                setTimeout(() => map.invalidateSize(), 100);
            }
        }

        // --- Search ---
        async function doSearch() {
            const query = document.getElementById('query').value;
            const btn = document.getElementById('searchBtn');

            if (!query.trim()) {
                setStatus('Enter a search query');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Searching...';

            const hasLocation = await resolveLocation();
            if (!hasLocation) {
                btn.disabled = false;
                btn.textContent = 'Search';
                return;
            }

            const radius = getRadius();
            setStatus('Searching and ranking...');

            try {
                const resp = await fetch('/api/search', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ query, lat: currentLat, lng: currentLng, radius_m: radius, max_results: 20 })
                });
                const data = await resp.json();
                currentResults = data.places;
                renderResults(data);
                renderPlaceMarkers(data.places);
                drawSearchBoundary();

                map.setView([currentLat, currentLng], radius > 20000 ? 10 : radius > 10000 ? 11 : radius > 5000 ? 12 : 13);

                setStatus(`Found ${data.result_count} results for "${data.query}"`);
            } catch (e) {
                setStatus('Error: ' + e.message);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Search';
            }
        }

        // --- Render Results ---
        function renderResults(data) {
            const panel = document.getElementById('resultsPanel');

            if (!data.places.length) {
                panel.innerHTML = '<div class="loading">No results found</div>';
                return;
            }

            panel.innerHTML = data.places.map(p => `
                <div class="result-card" id="card-${p.rank}" onclick="focusPlace(${p.rank})">
                    <div class="rank-badge">${p.rank}</div>
                    <div class="place-info">
                        <div class="place-name">${p.name}</div>
                        <div class="place-meta">
                            <span class="score">CS ${p.credscore}</span>
                            <span class="rating">${p.rating ? '★ ' + p.rating : 'N/A'}</span>
                            <span>${p.user_rating_count ? p.user_rating_count.toLocaleString() + ' reviews' : ''}</span>
                        </div>
                        <div class="place-address">${p.address || ''}</div>
                        <div class="place-summary" id="summary-${p.rank}"></div>
                        <button class="summary-btn" id="summaryBtn-${p.rank}" onclick="event.stopPropagation(); loadSummary(${p.rank})">
                            Summarize
                        </button>
                        <button class="summary-btn" onclick="event.stopPropagation(); loadRecommend(${p.rank})" style="margin-left:4px">
                            What to order
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // --- Map Markers ---
        function renderPlaceMarkers(places) {
            placeMarkers.forEach(m => map.removeLayer(m));
            placeMarkers = [];

            places.forEach(p => {
                if (p.lat == null || p.lng == null) return;

                const marker = L.circleMarker([p.lat, p.lng], {
                    radius: Math.max(6, 14 - p.rank * 0.5),
                    fillColor: getScoreColor(p.credscore),
                    color: '#0f1117',
                    weight: 2,
                    fillOpacity: 0.9
                }).addTo(map);

                marker.bindPopup(`
                    <div style="font-family:system-ui;font-size:13px;min-width:180px">
                        <strong>#${p.rank} ${p.name}</strong><br>
                        <span style="color:#818cf8;font-weight:600">CredScore: ${p.credscore}</span><br>
                        ${p.rating ? '★ ' + p.rating + ' (' + p.user_rating_count.toLocaleString() + ')' : 'Unrated'}<br>
                        <small>${p.address || ''}</small>
                    </div>
                `);

                marker.placeRank = p.rank;
                placeMarkers.push(marker);
            });
        }

        function getScoreColor(score) {
            if (score >= 80) return '#4ade80';
            if (score >= 60) return '#818cf8';
            if (score >= 40) return '#facc15';
            if (score >= 20) return '#fb923c';
            return '#f87171';
        }

        // --- Focus Place ---
        function focusPlace(rank) {
            document.querySelectorAll('.result-card').forEach(c => c.classList.remove('active'));
            document.getElementById('card-' + rank).classList.add('active');

            if (window.innerWidth <= 768) showView('map');

            const marker = placeMarkers.find(m => m.placeRank === rank);
            if (marker) {
                map.setView(marker.getLatLng(), 15);
                marker.openPopup();
            }
        }

        // --- Summarize ---
        async function loadSummary(rank) {
            const btn = document.getElementById('summaryBtn-' + rank);
            const el = document.getElementById('summary-' + rank);
            const place = currentResults.find(p => p.rank === rank);
            if (!place) return;

            btn.disabled = true;
            btn.textContent = 'Loading...';

            try {
                const resp = await fetch('/api/summarize', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ place_id: place.place_id })
                });
                const data = await resp.json();
                el.textContent = data.summary;
                btn.style.display = 'none';
            } catch (e) {
                el.textContent = 'Failed to load summary';
                btn.disabled = false;
                btn.textContent = 'Retry';
            }
        }

        // --- Recommend ---
        async function loadRecommend(rank) {
            const place = currentResults.find(p => p.rank === rank);
            if (!place) return;

            document.getElementById('modalTitle').textContent = place.name;
            document.getElementById('modalSubtitle').textContent = 'Analyzing reviews...';
            document.getElementById('modalSummary').textContent = '';
            document.getElementById('modalRecs').innerHTML = '';
            document.getElementById('modalAvoid').innerHTML = '';
            document.getElementById('recommendModal').classList.add('visible');

            try {
                const resp = await fetch('/api/recommend', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ place_id: place.place_id })
                });
                const data = await resp.json();

                document.getElementById('modalSubtitle').textContent = 'What should you order?';
                document.getElementById('modalSummary').textContent = data.summary;

                if (data.recommendations.length) {
                    document.getElementById('modalRecs').innerHTML = data.recommendations.map((r, i) => `
                        <div class="rec-item">
                            <span class="rec-name">${i + 1}. ${r.item}</span>
                            ${r.mentions ? `<span class="rec-mentions"> (mentioned ${r.mentions}x)</span>` : ''}
                            <div class="rec-why">${r.why}</div>
                        </div>
                    `).join('');
                }

                if (data.avoid && data.avoid.length) {
                    document.getElementById('modalAvoid').innerHTML = `
                        <div class="avoid-section">
                            <div class="avoid-label">Maybe skip:</div>
                            ${data.avoid.map(a => `
                                <div class="avoid-item">${a.item} — ${a.why}</div>
                            `).join('')}
                        </div>
                    `;
                }
            } catch (e) {
                document.getElementById('modalSubtitle').textContent = 'Error loading recommendations';
            }
        }

        function closeModal() {
            document.getElementById('recommendModal').classList.remove('visible');
        }

        document.getElementById('recommendModal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        // --- Advanced toggle ---
        function toggleAdvanced() {
            const el = document.getElementById('advancedFields');
            const toggle = document.querySelector('.advanced-toggle');
            el.classList.toggle('visible');
            toggle.textContent = el.classList.contains('visible') ? '▾ Coordinates' : '▸ Coordinates';
        }

        // --- Status ---
        function setStatus(msg) {
            document.getElementById('statusBar').textContent = msg;
        }

        // --- Enter key ---
        document.querySelectorAll('#query, #locationInput').forEach(el => {
            el.addEventListener('keydown', e => {
                if (e.key === 'Enter') doSearch();
            });
        });
    </script>
</body>
</html>
