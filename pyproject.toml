[project]
name = "credrank"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.129.0",
    "google-genai>=1.63.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.1",
    "slowapi>=0.1.9",
    "uvicorn[standard]>=0.41.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "pandas>=3.0.0",
    "pytest>=9.0.2",
    "respx>=0.22.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/credrank"]
